name: Deploy to InfinityFree

# Run manually or on push to the main branch
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy via FTP
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the latest code from GitHub
      - name: Get latest code
        uses: actions/checkout@v4

      # Step 2: Remove Laravel cached bootstrap files
      # These must not reach production because they contain stale local config (e.g. DB_HOST=127.0.0.1).
      - name: Clean cached bootstrap files
        run: |
          rm -f bootstrap/cache/config.php
          rm -f bootstrap/cache/routes-v7.php
          rm -f bootstrap/cache/events.php
          rm -f bootstrap/cache/packages.php
          rm -f bootstrap/cache/services.php
        shell: bash

      # Step 3: Upload code via FTP (exclude .env and cached bootstrap files)
      - name: Deploy to InfinityFree via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftpupload.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /htdocs/
          timeout: 86400000
          log-level: standard
          exclude: |
            .env
            .env.example
            .env.*
            bootstrap/cache/config.php
            bootstrap/cache/routes-v7.php
            bootstrap/cache/events.php
            bootstrap/cache/packages.php
            bootstrap/cache/services.php
            storage/logs/*
            .git
            .gitignore
            .github
